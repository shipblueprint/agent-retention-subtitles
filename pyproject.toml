[project]
name = "whisper-tools"
version = "2.0.0"
description = "Shotlist-aligned SRT generator for the Toolstack Pipeline (OpenCode-orchestrated)"
requires-python = ">=3.10,<3.13"
dependencies = [
    "faster-whisper>=1.0.3",
    "torch==2.5.1+cu124",
    "torchaudio==2.5.1+cu124",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
